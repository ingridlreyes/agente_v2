[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "governance-studio"
version = "0.1.0"
description = "Agente de gobierno de datos e IA con entregables trazables"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "python-docx>=1.1,<2", "python-pptx>=1.0,<2", "XlsxWriter>=3.2,<4", "Pillow>=11,<13", "pypdf>=5,<7"]

[project.optional-dependencies]
azure = ["azure-identity>=1.20,<2", "azure-storage-blob>=12.24,<13"]

[project.scripts]
governance-studio = "governance_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["governance_studio*"]

[tool.setuptools.package-data]
governance_studio = ["static/*", "prompts/*"]
